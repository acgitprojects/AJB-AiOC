# /etc/nginx/conf.d/openclaw.conf
# ─────────────────────────────────────────────────────────────────────────────
# Reverse proxy: gw.upnx.asia → OpenClaw gateway on :18789
#
# Handles:
#   - HTTP /hooks/* (POST from Next.js API routes)
#   - WebSocket upgrade for browser real-time chat
#   - CORS for dashboard.upnx.asia
#
# Setup:
#   sudo cp .github/nginx/openclaw.conf /etc/nginx/conf.d/
#   sudo certbot --nginx -d gw.upnx.asia
#   sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name gw.upnx.asia;

    # certbot will add SSL redirect here after `certbot --nginx`

    # ── CORS (allow Next.js dashboard) ────────────────────────────────────────
    set $cors_origin "";
    if ($http_origin = "https://dashboard.upnx.asia") {
        set $cors_origin $http_origin;
    }

    location / {
        proxy_pass         http://127.0.0.1:18789;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts — keep-alive for WS heartbeat (60 s heartbeat < 90 s timeout)
        proxy_read_timeout  90s;
        proxy_send_timeout  90s;

        # CORS headers
        add_header Access-Control-Allow-Origin  $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Allow-Credentials "true" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}
