# /etc/nginx/conf.d/dashboard.conf
# ─────────────────────────────────────────────────────────────────────────────
# Reverse proxy: dashboard.upnx.asia → Next.js on :3000
#
# Setup:
#   sudo cp .github/nginx/dashboard.conf /etc/nginx/conf.d/
#   sudo certbot --nginx -d dashboard.upnx.asia
#   sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name dashboard.upnx.asia;

    # certbot will add SSL redirect here after `certbot --nginx`

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
    }
}
