name: CI

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]

jobs:
  build:
    name: Type-check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Stub values so the build doesn't fail without real secrets.
          # Real values are injected by Vercel at deploy time.
          OPENCLAW_GATEWAY_URL: https://gw.upnx.asia
          OPENCLAW_WS_URL: wss://gw.upnx.asia
          OPENCLAW_TOKEN: ci-stub-token
          OPENCLAW_DEFAULT_AGENT_ID: hooks
          OPENCLAW_SESSION_PREFIX: webchat
          OPENCLAW_TIMEOUT_SECONDS: "60"
