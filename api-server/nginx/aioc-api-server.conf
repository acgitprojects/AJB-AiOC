# nginx/aioc-api-server.conf
# ─────────────────────────────────────────────────────────────────────────────
# Nginx reverse-proxy config for the AiOC API Server on Instance B.
#
# Place this file at: /etc/nginx/sites-available/aioc-api-server
# Then: ln -s /etc/nginx/sites-available/aioc-api-server /etc/nginx/sites-enabled/
#        nginx -t && systemctl reload nginx
#
# Assumes:
#   - Certbot/Let's Encrypt SSL for api.askjary.com
#   - API Server running on 127.0.0.1:4000
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name api.askjary.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.askjary.com;

    ssl_certificate     /etc/letsencrypt/live/api.askjary.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.askjary.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── HTTP API ──────────────────────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # ── WebSocket proxy ───────────────────────────────────────────────────────
    location /ws {
        proxy_pass         http://127.0.0.1:4000/ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;  # 1 hour — keep WS alive
        proxy_send_timeout 3600s;
    }
}
