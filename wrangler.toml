# ─── Cloudflare Workers deployment — AiOC / askjary.com ──────────────────────
# Adapter: @opennextjs/cloudflare
#
# IMPORTANT: Service bindings are disabled for initial deployment.
# After your first successful deploy, uncomment the [[services]] section below
# and re-deploy to enable edge caching optimization.
#
# First-time setup:
#   npx wrangler login
#   npx wrangler deploy
#
# After successful first deploy:
#   1. Uncomment [[services]] section below
#   2. Uncomment [[r2_buckets]] section below
#   3. npx wrangler r2 bucket create aioc-opennext-cache
#   4. npm run deploy:cf
# ─────────────────────────────────────────────────────────────────────────────

name                = "ajb-ops-centre"
account_id          = "a6dce41188371c9e1bbec2c280799325"
main                = ".open-next/worker.js"
compatibility_date  = "2024-12-18"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev         = true
preview_urls        = false

# ── Static assets ─────────────────────────────────────────────────────────────
[assets]
directory = ".open-next/assets"
binding   = "ASSETS"

# ── Self-reference (required for OpenNext edge caching) ────────────────────────
# ⚠️  DISABLED FOR DEPLOYMENT - Service binding will fail without auth
# Uncomment AFTER first successful deploy when worker exists
# This binding requires the Worker to already exist in your Cloudflare account.
#
# [[services]]
# binding = "WORKER_SELF_REFERENCE"
# service = "ajb-ops-centre"

# ── R2 bucket for incremental cache (ISR / fetch cache) ────────────────────────
# Disabled for now - uncomment after successful first deploy
#
# [[r2_buckets]]
# binding     = "NEXT_INC_CACHE_R2_BUCKET"
# bucket_name = "aioc-opennext-cache"

# ── Custom domains ─────────────────────────────────────────────────────────────
# Domain must be on Cloudflare DNS. Cloudflare will provision the SSL cert.
[[routes]]
pattern       = "aioc.askjary.com"
custom_domain = true

[[routes]]
pattern       = "www.aioc.askjary.com"
custom_domain = true

# ── Non-secret runtime environment variables ───────────────────────────────────
[vars]
OPENCLAW_DEFAULT_AGENT_ID = "hooks"
OPENCLAW_SESSION_PREFIX   = "webchat"

# Demo mode — enable guest demo accounts (demo-admin@example.com / Demo@12345)
DEMO_MODE = "true"

# API Server URL (Instance B) — when set, all backend calls route through it.
# Set to "" to call OpenClaw (Instance A) directly.
API_SERVER_URL = "https://api.askjary.com"

# OpenClaw gateway URL — fallback when API_SERVER_URL is blank.
OPENCLAW_GATEWAY_URL = "https://oc.askjary.com"

# App URL (used in password reset emails)
APP_URL = "https://aioc.askjary.com"

# ── User data KV (user accounts, reset tokens) ────────────────────────────────
# Create with: npx wrangler kv namespace create USERS_KV
# Then replace the id below with the real namespace ID.
[[kv_namespaces]]
binding = "USERS_KV"
id      = "baa20bd090f44070ba79f34a1ebc780e"

# ── App URL (used in password reset emails) ────────────────────────────────────
# (APP_URL is set in the [vars] section above)

# ── Secrets (DO NOT put real values here — set via Wrangler CLI) ───────────────
# Run the following once per environment to store secrets securely:
#
#   npx wrangler secret put API_SERVER_SECRET
#   npx wrangler secret put OPENCLAW_HOOKS_TOKEN
#   npx wrangler secret put OPENCLAW_WS_TOKEN
#   npx wrangler secret put DASHBOARD_PASSWORD        # legacy single-user mode
#   npx wrangler secret put DASHBOARD_SESSION_SECRET  # e.g. openssl rand -hex 32
#   npx wrangler secret put RESEND_API_KEY            # https://resend.com

